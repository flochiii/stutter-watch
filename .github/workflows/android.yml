name: Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal && rustup override set 1.97.1
      - name: Install Android build tools
        run: sdkmanager --install 'platforms;android-37' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Cache build dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Test and build both Android installers
        run: android/gradlew -p android :app:testUniversalDebugUnitTest :app:lintUniversalDebug :app:assembleUniversalDebug :app:assembleArm64Debug --console=plain
      - name: Check APK architectures and native page alignment
        run: |
          python3 scripts/check-android-apk.py android/app/build/outputs/apk/universal/debug/app-universal-debug.apk --abis armeabi-v7a,arm64-v8a
          python3 scripts/check-android-apk.py android/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk --abis arm64-v8a
      - name: Keep Android test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.html
