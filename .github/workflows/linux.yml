name: Linux CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build and desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb xdotool dbus-x11 imagemagick rpm squashfs-tools openbox weston python3-tomli
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt && rustup override set 1.97.1
      - name: Cache Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: linux-22-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: linux-22-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Run the native Linux desktop and capture screenshots
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x960x24' python3 scripts/smoke-linux.py
      - name: Exercise native Wayland in a nested compositor
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x960x24' python3 scripts/smoke-wayland.py
      - name: Build Linux installable packages
        run: python3 scripts/package-linux.py
      - name: Save compiled release dependencies even if a desktop test fails
        if: failure()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: linux-22-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - name: Keep Linux test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-desktop-evidence
          path: |
            target/linux-evidence/*.png
            target/linux-evidence/*.json
            target/linux-evidence/*.log
            target/linux-evidence/wayland/*.png
            target/linux-evidence/wayland/*.json
            target/linux-evidence/wayland/*.log
            target/release/stutter-watch
            target/dist-linux/*
          if-no-files-found: warn
          retention-days: 14
