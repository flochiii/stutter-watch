name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])"
          if ($LASTEXITCODE -ne 0 -or "v$version" -ne $env:GITHUB_REF_NAME) { throw 'Tag must match Cargo package version' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release source must belong to protected main' }
          if (-not (Test-Path "docs/releases/$($env:GITHUB_REF_NAME).md")) { throw 'Release notes are missing' }
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.97.1
      - name: Build portable archive and dependency notices
        run: python scripts/package-windows.py
      - name: Test the packaged executable
        run: ./scripts/smoke-windows.ps1 -Archive (Get-Item target/dist/*.zip).FullName
      - name: Attest Windows archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/dist/*.zip
      - name: Keep release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: target/dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Create a draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --prerelease --title "Stutter Watch $($env:GITHUB_REF_NAME) — Windows preview" --notes-file "docs/releases/$($env:GITHUB_REF_NAME).md" target/dist/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
