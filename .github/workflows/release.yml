name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      candidate:
        description: Build a development candidate from this ref
        type: boolean
        default: true
      soak:
        description: Run a 30-minute Linux recorder resource test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.97.1
      - name: Validate release identity
        env:
          CANDIDATE: ${{ inputs.candidate || false }}
        run: python scripts/validate-release.py
      - name: Build portable archive and dependency notices
        run: python scripts/package-windows.py
      - name: Test the packaged executable
        run: ./scripts/smoke-windows.ps1 -Archive (Get-Item target/dist/*.zip).FullName
      - name: Build the per-user installer
        run: python scripts/installer-windows.py --archive (Get-Item target/dist/*.zip).FullName
      - name: Test installer lifecycle
        run: ./scripts/smoke-installer-windows.ps1 -Installer (Get-Item target/dist/*-setup.exe).FullName
      - name: Attest Windows archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            target/dist/*.zip
            target/dist/*-setup.exe
      - name: Keep release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: target/dist/*
          if-no-files-found: error
          retention-days: 30
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install desktop build and packaging tools
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb xdotool dbus-x11 imagemagick rpm squashfs-tools openbox weston python3-tomli
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal && rustup override set 1.97.1
      - name: Validate release identity
        env:
          CANDIDATE: ${{ inputs.candidate || false }}
        run: python3 scripts/validate-release.py
      - name: Build installable Linux packages
        run: python3 scripts/package-linux.py
      - name: Exercise X11 desktop
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x960x24' python3 scripts/smoke-linux.py
      - name: Exercise portable AppImage desktop lifetime
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          appimages=("$PWD"/target/dist-linux/*-linux-x64.AppImage)
          test "${#appimages[@]}" -eq 1
          test -x "${appimages[0]}"
          export STUTTER_WATCH_TEST_EXECUTABLE="${appimages[0]}"
          export STUTTER_WATCH_TEST_OUTPUT="$PWD/target/linux-evidence/appimage"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x960x24' python3 scripts/smoke-linux.py
      - name: Exercise native Wayland
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x960x24' python3 scripts/smoke-wayland.py
      - name: Attest Linux package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            target/dist-linux/*.deb
            target/dist-linux/*.rpm
            target/dist-linux/*.AppImage
            target/dist-linux/*.tar.gz
      - name: Keep Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-x64
          path: target/dist-linux/*
          if-no-files-found: error
          retention-days: 30
      - name: Keep desktop validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-validation
          path: |
            target/linux-evidence/**/*.png
            target/linux-evidence/**/result.json
          if-no-files-found: warn
          retention-days: 30
  linux-packages:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:22.04', family: deb }
          - { image: 'ubuntu:24.04', family: deb }
          - { image: 'ubuntu:26.04', family: deb }
          - { image: 'debian:12', family: deb }
          - { image: 'fedora:44', family: rpm }
          - { image: 'fedora:45', family: rpm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-x64
          path: target/installers
      - name: Test clean distro install, reinstall, removal and AppImage
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
          PACKAGE_FAMILY: ${{ matrix.family }}
        run: docker run --rm -v "$PWD/target/installers:/artifacts" -v "$PWD/scripts:/tests:ro" "$DISTRO_IMAGE" sh /tests/smoke-linux-package.sh "$PACKAGE_FAMILY"
  linux-soak:
    if: inputs.soak
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-x64
          path: target/installers
      - name: Measure 30-minute recorder behavior
        run: |
          mkdir -p target/soak-binary
          tar xzf target/installers/*-linux-x64.tar.gz -C target/soak-binary
          python3 scripts/soak-linux.py target/soak-binary/stutter-watch-*/usr/bin/stutter-watch target/linux-evidence/soak
      - name: Keep resource measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-resource-soak
          path: target/linux-evidence/soak/resources.json
          if-no-files-found: error
          retention-days: 30
