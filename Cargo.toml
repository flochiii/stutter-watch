[package]
name = "stutter-watch"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "Desktop stutter recorder with local charts, protected incident captures, and selectable ETW telemetry"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/flochiii/stutter-watch"
readme = "README.md"
keywords = ["windows", "stutter", "etw", "diagnostics", "performance"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1.2"
nvml-wrapper = "0.13"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame"] }
csv = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ksni = "0.3"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
x11rb = "0.13"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Performance", "Win32_System_ProcessStatus",
  "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_StationsAndDesktops", "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Power",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_Graphics_Dxgi", "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_IO",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_SystemServices", "Win32_System_Kernel", "Win32_System_Time", "Win32_System_Console", "Wdk_System_SystemInformation"
] }

[dev-dependencies]
tempfile = "3"
zstd = { version = "0.14", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
